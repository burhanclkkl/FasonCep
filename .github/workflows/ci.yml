name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/fasoncep/backend/requirements.lock
            apps/fasoncep/backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/fasoncep/frontend/package-lock.json
      - run: python scripts/check_repository.py
      - run: pip install -r requirements-dev.txt
        working-directory: apps/fasoncep/backend
      - run: python -m pytest -q
        working-directory: apps/fasoncep/backend
      - run: npm ci
        working-directory: apps/fasoncep/frontend
      - run: npm test
        working-directory: apps/fasoncep/frontend
      - run: npm run build
        working-directory: apps/fasoncep/frontend
      - run: python scripts/check_public_site.py
      - run: docker build -t fasoncep:ci .
