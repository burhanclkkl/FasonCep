services:
  app:
    build: .
    restart: unless-stopped
    environment:
      FASONCEP_ENV: production
      FASONCEP_MAIL_ENABLED: ${FASONCEP_MAIL_ENABLED:-0}
      FASONCEP_SMTP_HOST: ${FASONCEP_SMTP_HOST:-}
      FASONCEP_SMTP_PORT: ${FASONCEP_SMTP_PORT:-587}
      FASONCEP_SMTP_SECURITY: ${FASONCEP_SMTP_SECURITY:-starttls}
      FASONCEP_SMTP_USERNAME: ${FASONCEP_SMTP_USERNAME:-}
      FASONCEP_SMTP_PASSWORD: ${FASONCEP_SMTP_PASSWORD:-}
      FASONCEP_MAIL_FROM: ${FASONCEP_MAIL_FROM:-}
      FASONCEP_MAIL_TO: ${FASONCEP_MAIL_TO:-}
      FASONCEP_DEMO_REQUESTS_ENABLED: ${FASONCEP_DEMO_REQUESTS_ENABLED:-0}
      FASONCEP_SITE_MODE: ${FASONCEP_SITE_MODE:-marketing}
      FASONCEP_OPERATOR_NAME: ${FASONCEP_OPERATOR_NAME:-}
      FASONCEP_CONTACT_EMAIL: ${FASONCEP_CONTACT_EMAIL:-}
      FASONCEP_PUBLIC_URL: https://${DOMAIN:?DOMAIN must be set}
      FASONCEP_DATA_DIR: /data
      FASONCEP_ALLOWED_HOSTS: ${DOMAIN:?DOMAIN must be set},127.0.0.1,localhost
      FASONCEP_SECURE_COOKIES: "1"
      # No host API port. The separate egress network permits outbound SMTP.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - app_data:/data
    networks:
      - backend
      - mail_egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
      - public
networks:
  mail_egress:
  backend:
    internal: true
  public:
volumes:
  app_data:
  caddy_data:
  caddy_config:
